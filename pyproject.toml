[project]
name = "dbop"
version = "0.1.0"
description = "Demand-based option pricing without market-maker mandates: Deribit evidence"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14",
    "requests>=2.31",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dbop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
